# Redirect www to non-www (301 permanent)
if ($host = www.openzootcg.com) {
    return 301 https://openzootcg.com$request_uri;
}

# gzip: compress JS, CSS, and fonts
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/javascript text/css image/svg+xml application/xml font/ttf;

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Bot detection for SEO handlers
set $is_bot "";
if ($http_user_agent ~* "(facebookexternalhit|Twitterbot|Discordbot|Slackbot|LinkedInBot|WhatsApp|TelegramBot|Applebot|Google.*snippet|bingbot|Googlebot|SkypeUriPreview|redditbot|Meta-ExternalAgent)") {
    set $is_bot "1";
}

# Cache static assets
location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /fonts/ {
    types { font/ttf ttf; }
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location /models/ {
    add_header Cache-Control "public, max-age=2592000";
}

location = /index.html {
    expires -1;
}

# Bare /gallery: serve SPA, bypass physical directory
location = /gallery  { expires -1; try_files /index.html =404; }
location = /gallery/ { expires -1; try_files /index.html =404; }

# Gallery card pages: bot → PHP SEO handler, non-bot → SPA
location ~ ^/gallery/(?!.*\.php)([^/?#]+)/?$ {
    if ($is_bot = "1") {
        rewrite ^/gallery/([^/?#]+)/?$ /gallery/index.php?cardId=$1 last;
    }
    expires -1;
    try_files /index.html =404;
}

# Discord notify API
location = /api/notify {
    rewrite ^ /api/notify.php last;
}

# SPA catch-all fallback
location / {
    try_files $uri /index.html;
}
